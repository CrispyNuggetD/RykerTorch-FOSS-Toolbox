<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive pointer demo</title><link rel="stylesheet" href="adaptive-pointer.css"><script defer src="adaptive-pointer.js" data-storage-key="toolbox.demo.pointer"></script><style>body{max-width:760px;margin:60px auto;padding:24px;background:#eef3f7;color:#203044;font:17px/1.7 system-ui}button,input,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #b8cad6}input,textarea{display:block;width:90%;margin:12px 0}nav{display:flex;gap:25px}a{color:#2853b5}footer{margin-top:40px}summary{cursor:pointer}</style></head><body><nav><a href="#demo">Try the demo</a><a href="README.md">Read the source guide</a></nav><h1>Same pointer. Different shapes.</h1><p>Select this text, hover a link, or try the field. The actual controls keep their ordinary behaviour.</p><section id="demo"><button type="button" onclick="this.textContent='Clicked normally'">A real button</button><label>Type here<input placeholder="Text selection still works"></label><textarea aria-label="Try a longer note">Editable text</textarea><details><summary>Native disclosure</summary><p>No custom click handler is needed.</p></details></section><footer>Local preference only. No movement tracking.</footer></body></html>
